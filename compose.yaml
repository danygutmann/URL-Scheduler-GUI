services:
  url-scheduler:
    build:
      context: .
    image: url-scheduler:local
    restart: unless-stopped
    init: true
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:${APP_PORT:-8080}"
    env_file:
      - .env
    environment:
      APP_DATA_DIR: /app/data
    volumes:
      - scheduler-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:'+__import__('os').getenv('APP_PORT','8080')+'/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  scheduler-data:
