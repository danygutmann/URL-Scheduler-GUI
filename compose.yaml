# Portainer: Stacks -> Add stack -> Web editor, diesen Inhalt einfügen.
# Alle Einstellungen stehen unten im Abschnitt "environment" bzw. oben im Build-Kontext.
services:
  url-scheduler:
    build:
      # Git-Download direkt durch Docker (Branch nach '#' anpassen)
      context: https://github.com/danygutmann/URL-Scheduler-GUI.git#main
    image: url-scheduler:latest
    container_name: url-scheduler
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Berlin
      APP_TIMEZONE: Europe/Berlin
      # Vorhandener MariaDB-Server (Datenbank und Benutzer vorher anlegen)
      DB_HOST: 192.168.1.10
      DB_PORT: "3306"
      DB_NAME: url_scheduler
      DB_USER: scheduler
      DB_PASSWORD: change-me
      # Optional: erlaubte interne Ziele (IP/CIDR), z.B. 192.168.1.0/24
      APP_ALLOWED_PRIVATE_TARGETS: ""
